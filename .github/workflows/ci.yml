name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: macOS
            os: macos-latest
            bundles: app,dmg
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf xvfb dbus-x11 at-spi2-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查
        run: npm run typecheck

      - name: 前端测试
        run: npm test

      - name: 构建前端和 steppy-hook
        run: |
          npm run build
          npm run build:hook

      - name: 代码格式
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 单元测试
        run: cargo test --workspace

      - name: 两个实例的端到端测试（Xvfb）
        if: runner.os == 'Linux'
        run: |
          cargo build -p steppy
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- \
            python3 e2e/two_instances.py target/debug/steppy target/release/steppy-hook

      - name: 构建安装包
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: steppy-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
